services:
  postgres:
    image: postgres:16-alpine
    container_name: posgress_server_gym_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: gymdb_db
    ports:
      - "5434:5432"
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gymdb_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  gym-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: gym-tracker:latest
    container_name: gym-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/gymdb_db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=meta-llama/llama-4-scout-17b-16e-instruct
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_data:
    driver: local
